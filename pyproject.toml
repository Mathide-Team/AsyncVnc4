[project]
name = "asyncvnc2"
version = "0.1.0"
description = "Fork maison d'asyncvnc (client/serveur RFB pur Python, VNC) avec patches xvp, listen(), repli de version, VeNCrypt, WebSockets, Extended Clipboard, RSA-AES"
readme = "docs/reference/downstream-consumer.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "loguru>=0.7",
    "cryptography>=41.0",
    "keysymdef>=1.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6",  # couverture lignes + branches, seuil bloquant (issue #54)
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.format]
quote-style = "single"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["asyncvnc2.py"]

[tool.coverage.run]
# Couverture des branches obligatoire (Mathilde-Team/.github#9).
branch = true
source = ["asyncvnc2"]

[tool.coverage.report]
# Seuil bloquant de l'équipe : 95 % visé (décision du 21/10/2026,
# Mathilde-Team/.github#9). Palier 1 (issue #54) : mesure du job Qualité au
# 22/10/2026 (51,32 % lignes + branches, test_asyncvnc2 + test_reseau_local)
# arrondie à l'entier inférieur ; à relever à chaque PR de tests. Déclaré ici
# seulement, lu par `coverage report` dans ci.yml.
fail_under = 51
show_missing = true
