name: CI

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  quality:
    name: Qualité (lint, format, tests)
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '{"group":"maison","labels":["self-hosted","linux"]}') }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Installation de Python
        run: uv python install

      - name: Installation des dépendances
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check asyncvnc2.py test_asyncvnc2.py

      - name: Formatage (ruff format --check)
        run: uv run ruff format --check asyncvnc2.py test_asyncvnc2.py

      - name: Tests (unittest)
        # Suite documentée dans CLAUDE.md « Commandes de qualité » :
        # 50 tests, aucun vrai serveur VNC nécessaire.
        run: uv run python3 -m unittest test_asyncvnc2 -v
